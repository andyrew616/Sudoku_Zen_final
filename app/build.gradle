plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Private local configuration; credential values never belong in Gradle/source files.
def uploadSigningPropertiesFile = rootProject.file('.local-upload-signing/upload-signing.properties')
def uploadSigningProperties = new Properties()
if (uploadSigningPropertiesFile.isFile()) {
    uploadSigningPropertiesFile.withInputStream { uploadSigningProperties.load(it) }
}
def uploadStoreFile = uploadSigningProperties.getProperty('storeFile')
def uploadPasswordFile = uploadSigningProperties.getProperty('passwordFile')
def uploadKeyAlias = uploadSigningProperties.getProperty('keyAlias')
def uploadSigningConfigured = uploadStoreFile && uploadPasswordFile && uploadKeyAlias &&
        rootProject.file(uploadStoreFile).isFile() && rootProject.file(uploadPasswordFile).isFile()

android {
    namespace 'rew.lightgames.sudoku2'
    compileSdk 36

    defaultConfig {
        applicationId 'rew.lightgames.zensudoku'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        if (uploadSigningConfigured) {
            upload {
                storeFile rootProject.file(uploadStoreFile)
                storePassword rootProject.file(uploadPasswordFile).readLines('UTF-8').first()
                keyAlias uploadKeyAlias
                keyPassword rootProject.file(uploadPasswordFile).readLines('UTF-8').first()
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // New listing: this is the local UPLOAD key, not Google's app-signing key.
            if (uploadSigningConfigured) {
                signingConfig signingConfigs.upload
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:24.3.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.opencsv:opencsv:5.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.google.code.gson:gson:2.14.0'
}

// Fail before packaging a release if local upload credentials are unavailable.
// Unit tests and lint remain runnable without possessing the private key.
def verifyUploadSigning = tasks.register('verifyUploadSigning') {
    doLast {
        if (!uploadSigningConfigured) {
            throw new GradleException('Release upload signing is not configured. See docs/release/UPLOAD-SIGNING.md; debug signing is never used for releases.')
        }
        if (android.buildTypes.release.signingConfig != android.signingConfigs.upload) {
            throw new GradleException('Release must use the configured upload signing key.')
        }
    }
}
tasks.configureEach {
    if (name in ['packageRelease', 'packageReleaseBundle', 'signReleaseBundle', 'bundleRelease', 'assembleRelease']) {
        dependsOn verifyUploadSigning
    }
}
